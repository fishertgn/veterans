name: Publicador Veterans Tarragona
on:
  schedule:
    # Hores en UTC. Cobreixen l'horari d'estiu (+2) i el d'hivern (+1); el script decideix amb l'hora de Madrid.
    # Minuts 23 i 53: GitHub retarda o descarta les execucions programades a l'hora en punt. Dues per hora
    # donen marge; el publicador recorda què ha enviat i no repeteix res.
    - cron: '23,53 8-10 * * 4'    # dijous 10h: pròxims partits
    - cron: '23,53 8-10,20-22 * * 5'   # divendres 10h (pròxims partits) i 22h+ (resultats)
    - cron: '23,53 12-22 * * 6'   # dissabte 14-23h
    - cron: '23,53 7-17 * * 0'    # diumenge 9-18h
    - cron: '23,53 7-11 * * 1'    # dilluns 9h (paquet setmanal), amb marge per retards
  workflow_dispatch:
    inputs:
      mode:
        description: 'programat | igcheck | ighistoria (PUBLICA les històries de pròxims partits pendents) | ara | proxims | reelproxims | partit | mensual | reel (prova) | dilluns | prova'
        default: 'prova'
permissions:
  contents: write
concurrency: publicador
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Pillow (PNG a JPEG per a Instagram)
        run: pip install -q pillow
      - name: ffmpeg (només quan cal fer el reel)
        env:
          MODE: ${{ github.event.inputs.mode || 'programat' }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$(date -u +%u)" = "4" ] || [ "$MODE" = "reel" ] || [ "$MODE" = "reelproxims" ] || [ "$MODE" = "dilluns" ]; then
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          fi
      - name: Executar publicador
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'programat' }}
        run: |
          case "$MODE" in
            ara) python publicar.py --ara ;;
            dilluns) python publicar.py --dilluns ;;
            proxims) python publicar.py --proxims ;;
            partit) python publicar.py --partit ;;
            mensual) python publicar.py --mensual ;;
            igcheck) python instagram.py check ;;
            ighistoria) python instagram.py prova-historia ;;
            reel) python reel.py resultats 2026-09-26 2026-09-27 --test --send ;;
            reelproxims) python reel.py proxims --send ;;
            prova) touch PROVA && python publicar.py ;;
            *) python publicar.py ;;
          esac
      - name: Desar l'estat
        run: |
          git config user.name "publicador"; git config user.email "publicador@users.noreply.github.com"
          git pull --rebase -q || true
          git add estat.json publicar.log 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "estat $(date -u +%FT%H:%MZ)" && git push)
